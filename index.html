<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link rel="stylesheet" href="index.css" />
  </head>










  <body>
    <div class="container">
      <div id="todoboard" class="Board">
        <h1>Todo</h1>
        <p draggable="true" class="item">Watching Lectures</p>
        <p draggable="true" class="item">Cleaning Desk</p>
      </div>

      <div id="OngoingBoard" class="Board">
        <h1>Ongoing</h1></div>

      <div id="DoneBoard" class="Board">
        <h1>done</h1></div>
    </div>

    <button onclick="addElement()">Add Todo</button>

    <script src="index.js"></script>
  </body>












</html>
